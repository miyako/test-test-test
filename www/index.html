<!DOCTYPE html>
<html >
<head>
    <meta charset="UTF-8">
    <style class="cp-pen-styles">

        /* = body------------------------*/
        body {
            background: white;
            width: 1020px; /*can be in percentage also.*/
            height: auto;
            margin: 0 auto;
        }

        .title{
            display: block;
        }
        
               
        .title img{
          float: left;
          margin: 15px 50px 50px 200px;
        }
        .title h1{
          float: left;
          margin: 60px 0px 0px 50px;
        }
        h1 {
            font: normal Arial, Helvetica, sans-serif; 
            text-align: center;
            color: #4D1A75;
        }
        /* = Scroll body------------------------*/
        ::-webkit-scrollbar {
            width: 0.2em;
        }
        ::-webkit-scrollbar-track {
            background-color: #bdc3c7;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #7f8c8d;
        }
        /* = table------------------------*/
        .datagrid table { 
            border-collapse: collapse; 
            text-align: left; 
            width: 100%; 
        } 
        .datagrid {
            clear: left;
            font: normal 12px/150% Arial, Helvetica, sans-serif; 
            background: #fff; 
            overflow: hidden; 
            border: 1px solid #652299; 
            -webkit-border-radius: 3px; 
            -moz-border-radius: 3px; 
            border-radius: 3px; 
            }
        .datagrid table td, .datagrid table th { 
            padding: 3px 10px; 
        }
        .datagrid table thead th {
            background:-webkit-gradient( linear, left top, left bottom, color-stop(0.05, #652299), color-stop(1, #4D1A75) );
            background:-moz-linear-gradient( center top, #652299 5%, #4D1A75 100% );
            filter:progid:DXImageTransform.Microsoft.gradient(startColorstr='#652299', endColorstr='#4D1A75');
            background-color:#652299; 
            color:#FFFFFF; 
            font-size: 15px; 
            font-weight: bold; 
            border-left: 1px solid #714399; 
        } 
        .datagrid table thead th:first-child { 
            border: none; 
        }
        .datagrid table tbody td { 
            color: #4D1A75;
            border-left: 1px solid #E7BDFF;
            font-size: 12px;
            font-weight: normal; 
        }
        .datagrid tr:nth-child(even) { 
            background: #F4E3FF; 
            color: #4D1A75; 
        }
        .datagrid table tbody td:first-child { 
            border-left: none; 
        }
        .datagrid table tbody tr:last-child td { 
            border-bottom: none; 
        }
        div.dhtmlx_window_active, div.dhx_modal_cover_dv { 
            position: fixed !important; 
        }
    </style>
    <!-- Google fonts -->
</head>

<body>
    <!-- Description -->
    <div class="title">
    <img src="/images/4D.png" alt="4D">
    <h1> Process List</h1>
<div>

    <!-- Table demo -->
    <div class="datagrid">
        <table data-fn="processes" data-url="/4daction/WebGetJSONData"></table>
    </div>

    <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
    <script>
        (function () {
            'use-strict';
            var elem,
                // data-fn
                dataFn = $('[data-fn="processes"]'),
                // data-url
                thisUrl = dataFn.data('url');

            if (typeof $.table_of_processes == 'undefined')
                $.table_of_processes = {};

            $.table_of_processes.get = {
                init: function () {
                    if (dataFn) {
                        this.getJson();
                    } else {
                        dataFn.html('No data found.');
                    }
                },

                /* = Get data ------------------------*/
                getJson: function (url) {
                    var self = this;
                    // loading data before
                    dataFn.html('<span class="loading_table">' + 'Loading Please Wait ....' + '</span>');
                    // No ajax cache
                    $.ajaxSetup({
                        cache: false
                    });
                    // Get json
                    $.getJSON(thisUrl, function (data) {
                        // load template
                        var out_html = self.tpl();
                        $.each(data, function (i, obj) {
                            // load inner template
                            out_html += self.tpl_inner(obj);
                        });
                        // close tag
                        out_html += '</tbody>';
                        // render templates
                        dataFn.html(out_html);
                        // error 
                    }).error(function (j, t, e) {
                        // render error.
                        dataFn.html('<span class="error_table">' + 'Error = ' + e + '</span>');
                    });
                },
                // head table template
                tpl: function () {
                    var html = '<thead>' +
                        '<tr>' +
                        '<th>Process Name</th>' +
                        '<th>Session</th>' +
                        '<th>Type</th>' +
                        '<th>Num</th>' +
                        '<th>State</th>' +
                        '<th>CPU Time</th>' +
                        '<th>Activity (%)</th>' +
                        '</tr>' +
                        '</thead>' +
                        '<tbody >';
                    return html;
                },
                // inner template
                tpl_inner: function (obj) {
                    var html = '<tr>' +
                        '<td>' + obj.name + '</td>' +
                        '<td>' + obj.session + '</td>' +
                        '<td>' + obj.type + '</td>' +
                        '<td>' + obj.num + '</td>' +
                        '<td>' + obj.state + '</td>' +
                        '<td>' + obj.cpuTime + '</td>' +
                        '<td>' + obj.cpuUsage + '</td>' +
                        '</tr>';
                    return html;
                }
            };
            // on ready render data
            $(document).ready(function () {
                $.table_of_processes.get.init();
            });
        }).call(this);
    </script>
</body>
</html>
